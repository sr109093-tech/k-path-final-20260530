name: kpath
description: "K-Path: GPS Walking, Hiking, and Cycling Tracking Application with TTS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  image_picker: ^1.0.7
  flutter_tts: ^3.8.5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  permission_handler: ^11.3.0
  # 🛠️ [★누락 결함 완치 핵심]: 홈 화면 웹 링크 연동 및 GPX 기록 공유를 위한 정품 플러그인 재결합
  url_launcher: ^6.2.5
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/